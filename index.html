<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luganda Learner</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Clean, modern resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        header h1 {
            color: #1e3a8a;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        /* Category Dropdown Styling */
        .selector-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .category-select {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: #1e3a8a;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .category-select:focus {
            border-color: #1e3a8a;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* 3D Flashcard Wrapper */
        .flashcard-container {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-front {
            background-color: #ffffff;
            color: #1e293b;
        }

        .card-front h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .card-back {
            background-color: #1e3a8a;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-back h3 {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.8;
            word-break: break-word;
        }

        .card-back hr {
            width: 40%;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            margin: 15px 0;
        }

        .card-back h2 {
            font-size: 1.5rem;
            font-weight: 600;
            word-break: break-word;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
        }

        .controls {
            width: 100%;
        }

        .btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:hover {
            background-color: #059669;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Version Badge Styling */
        footer {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="networkDebugger" style="display: none;"></div>

    <header>
        <h1>Luganda Learner</h1>
        <div class="selector-container">
            <select id="categorySelect" class="category-select" onchange="switchCategory(this.value)">
                <option value="small words">✏️ Small Words</option>
                <option value="family">👨‍👩‍👧‍👦 Family</option>
                <option value="food">🍌 Food</option>
                <option value="body parts">💪 Body Parts</option>
                <option value="household items">🏠 Household Items</option>
                <option value="outside">🌳 Outside</option>
            </select>
        </div>
    </header>

    <main class="app-container">
        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard" id="flashcard">
                <div class="card-side card-front">
                    <h2 id="lugandaFront">Loading...</h2>
                    <span class="hint">Tap to flip</span>
                </div>
                <div class="card-side card-back">
                    <h3 id="lugandaBack">Loading...</h3>
                    <hr>
                    <h2 id="englishBack">Loading...</h2>
                    <span class="hint">Tap to flip back</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="nextBtn" class="btn">Next Word &rarr;</button>
        </div>
    </main>

    <footer>
        App Version: v1.2 Production (No-Repeat)
    </footer>

    <script>
        let masterDatabase = {};
        let activeList = [];
        
        // Dynamic playlist tracker that shrinks as you view words
        let shuffledDeck = [];

        const flashcard = document.getElementById('flashcard');
        const nextBtn = document.getElementById('nextBtn');
        const lugandaFront = document.getElementById('lugandaFront');
        const lugandaBack = document.getElementById('lugandaBack');
        const englishBack = document.getElementById('englishBack');
        const categorySelect = document.getElementById('categorySelect');

        async function loadMasterData() {
            const debugBox = document.getElementById('networkDebugger');
            try {
                const cloudUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTfnLZbNhfSiw-xsabAsZW-tvg96yKPRWNnZ9oZu-is1iTpgogFqlBMoIk6H1WM9w/pub?output=csv';
                
                debugBox.innerHTML = "Status: Fetching...";
                const response = await fetch(`${cloudUrl}&t=${new Date().getTime()}`);
                const rawText = await response.text();
                
                masterDatabase = {}; 
                const rows = rawText.split(/[\r\n]+/);
                
                for (let i = 0; i < rows.length; i++) {
                    const currentRow = rows[i].trim();
                    if (!currentRow) continue; 
                    
                    const columns = currentRow.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (columns.length < 3) continue; 
                    
                    const rawCategory = columns[0].replace(/^"|"$/g, '').trim(); 
                    const category = rawCategory.toLowerCase();
                    
                    const lugandaWord = columns[1].replace(/^"|"$/g, '').trim();
                    const englishWord = columns[2].replace(/^"|"$/g, '').trim();
                    
                    if (category === 'category') continue;
                    
                    if (!masterDatabase[category]) {
                        masterDatabase[category] = [];
                    }
                    
                    masterDatabase[category].push({ 
                        luganda: lugandaWord, 
                        english: englishWord 
                    });
                }
                
                let currentSelection = categorySelect.value.toLowerCase();
                if (masterDatabase[currentSelection]) {
                    switchCategory(currentSelection);
                } else {
                    const fallback = Object.keys(masterDatabase)[0];
                    if (fallback) switchCategory(fallback);
                }
                
            } catch (error) {
                lugandaFront.innerText = "Connection Error";
                console.error(error);
            }
        }
        
        function switchCategory(categoryKey) {
            const targetKey = categoryKey.toLowerCase();
            if (!masterDatabase[targetKey]) return;
            
            activeList = masterDatabase[targetKey];
            
            // Wipe the current playlist tracker so a fresh one loads instantly for the new deck
            shuffledDeck = [];
            
            getNewWord();
        }

        function getNewWord() {
            if (activeList.length === 0) {
                lugandaFront.textContent = "Empty Deck";
                lugandaBack.textContent = "Empty Deck";
                englishBack.textContent = "No words found in this category.";
                return;
            }
            
            flashcard.classList.remove('is-flipped');
            
            setTimeout(() => {
                // If we've run out of words or are starting fresh, clone a new batch from the source list
                if (shuffledDeck.length === 0) {
                    shuffledDeck = [...activeList]; 
                }
                
                // Select a random index explicitly from what remains inside the temporary deck
                let randomIndex = Math.floor(Math.random() * shuffledDeck.length);
                
                // Pull (splice) that specific card out of the deck completely
                const currentWord = shuffledDeck.splice(randomIndex, 1)[0];
                
                // Update interface with the drawn card
                lugandaFront.textContent = currentWord.luganda;
                lugandaBack.textContent = currentWord.luganda;
                englishBack.textContent = currentWord.english;
            }, 200);
        }

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
        });

        nextBtn.addEventListener('click', getNewWord);
        window.addEventListener('DOMContentLoaded', loadMasterData);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
