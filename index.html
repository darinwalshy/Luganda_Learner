<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luganda Learner</title>
    <link class="manifest" href="manifest.json">
    <style>
        /* Clean, modern resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        header h1 {
            color: #1e3a8a;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        /* Category Dropdown Styling */
        .selector-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .category-select {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: #1e3a8a;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .category-select:focus {
            border-color: #1e3a8a;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* Progress Counter Style */
        .progress-counter {
            font-size: 1rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: -15px; /* Pulls it closer to the flashcard */
        }

        /* 3D Flashcard Wrapper */
        .flashcard-container {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-front {
            background-color: #ffffff;
            color: #1e293b;
        }

        .card-front h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .card-back {
            background-color: #1e3a8a;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-back h3 {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.8;
            word-break: break-word;
        }

        .card-back hr {
            width: 40%;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            margin: 15px 0;
        }

        .card-back h2 {
            font-size: 1.5rem;
            font-weight: 600;
            word-break: break-word;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* BASE BUTTON RESET */
        .btn-base {
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-base:active {
            transform: scale(0.98);
        }

        /* PRIMARY ACTION: Next Word (Super-sized to 36px padding) */
        .btn-primary {
            background-color: #10b981;
            color: white;
            padding: 36px; 
            font-size: 1.25rem; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background-color: #059669;
        }

        /* SECONDARY ACTION: Review Again */
        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
            padding: 16px; 
            font-size: 1.05rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
            color: #1e293b;
        }

        /* Version Badge Styling */
        footer {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="networkDebugger" style="display: none;"></div>

    <header>
        <h1>Luganda Learner</h1>
        <div class="selector-container">
            <select id="categorySelect" class="category-select" onchange="switchCategory(this.value)">
                <option value="small words">✏️ Small Words</option>
                <option value="family">👨‍👩‍👧‍👦 Family</option>
                <option value="food">🍌 Food</option>
                <option value="body parts">💪 Body Parts</option>
                <option value="household items">🏠 Household Items</option>
                <option value="outside">🌳 Outside</option>
            </select>
        </div>
    </header>

    <main class="app-container">
        <div id="progressCounter" class="progress-counter">--/--</div>

        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard" id="flashcard">
                <div class="card-side card-front">
                    <h2 id="lugandaFront">Loading...</h2>
                    <span class="hint">Tap to flip</span>
                </div>
                <div class="card-side card-back">
                    <h3 id="lugandaBack">Loading...</h3>
                    <hr>
                    <h2 id="englishBack">Loading...</h2>
                    <span class="hint">Tap to flip back</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="nextBtn" class="btn-base btn-primary">Next Word &rarr;</button>
            <button id="reviewBtn" class="btn-base btn-secondary">Review again</button>
        </div>
    </main>

    <footer>
        App Version: v1.6-Offline-Fix
    </footer>

    <script>
        let masterDatabase = {};
        let activeList = [];
        let shuffledDeck = [];
        let currentCardItem = null;

        const flashcard = document.getElementById('flashcard');
        const nextBtn = document.getElementById('nextBtn');
        const reviewBtn = document.getElementById('reviewBtn');
        const lugandaFront = document.getElementById('lugandaFront');
        const lugandaBack = document.getElementById('lugandaBack');
        const englishBack = document.getElementById('englishBack');
        const categorySelect = document.getElementById('categorySelect');
        const progressCounter = document.getElementById('progressCounter');

        async function loadMasterData() {
            const debugBox = document.getElementById('networkDebugger');
            let rawText = "";
            
            try {
                const cloudUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTfnLZbNhfSiw-xsabAsZW-tvg96yKPRWNnZ9oZu-is1iTpgogFqlBMoIk6H1WM9w/pub?output=csv';
                
                debugBox.innerHTML = "Status: Fetching from Cloud...";
                const response = await fetch(`${cloudUrl}&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Cloud fetch failed status");
                rawText = await response.text();
                
            } catch (error) {
                console.log("Cloud unavailable, loading offline local words.json fallback...", error);
                try {
                    const localResponse = await fetch('./words.json');
                    const localData = await localResponse.json();
                    
                    masterDatabase = {};
                    for (const cat in localData) {
                        masterDatabase[cat.toLowerCase()] = localData[cat];
                    }
                    
                    instantiateCategorySelection();
                    return; 
                } catch (jsonError) {
                    lugandaFront.innerText = "Connection Error";
                    console.error("Both cloud and local fallback failed", jsonError);
                    return;
                }
            }
            
            masterDatabase = {}; 
            const rows = rawText.split(/[\r\n]+/);
            
            for (let i = 0; i < rows.length; i++) {
                const currentRow = rows[i].trim();
                if (!currentRow) continue; 
                
                const columns = currentRow.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (columns.length < 3) continue; 
                
                const rawCategory = columns[0].replace(/^"|"$/g, '').trim(); 
                const category = rawCategory.toLowerCase();
                
                const lugandaWord = columns[1].replace(/^"|"$/g, '').trim();
                const englishWord = columns[2].replace(/^"|"$/g, '').trim();
                
                if (category === 'category') continue;
                
                if (!masterDatabase[category]) {
                    masterDatabase[category] = [];
                }
                
                masterDatabase[category].push({ 
                    luganda: lugandaWord, 
                    english: englishWord 
                    });
            }
            
            instantiateCategorySelection();
        }

        function instantiateCategorySelection() {
            let currentSelection = categorySelect.value.toLowerCase();
            if (masterDatabase[currentSelection]) {
                switchCategory(currentSelection);
            } else {
                const fallback = Object.keys(masterDatabase)[0];
                if (fallback) switchCategory(fallback);
            }
        }
        
        function switchCategory(categoryKey) {
            const targetKey = categoryKey.toLowerCase();
            if (!masterDatabase[targetKey]) return;
            
            activeList = masterDatabase[targetKey];
            shuffledDeck = [];
            currentCardItem = null;
            
            getNewWord();
        }

        function updateProgressUI() {
            if (activeList.length === 0) {
                progressCounter.textContent = "0/0";
                return;
            }
            let remainingCount = shuffledDeck.length;
            if (currentCardItem) {
                remainingCount += 1;
            }
            
            progressCounter.textContent = `${remainingCount}/${activeList.length}`;
        }

        function getNewWord() {
            if (activeList.length === 0) {
                lugandaFront.textContent = "Empty Deck";
                lugandaBack.textContent = "Empty Deck";
                englishBack.textContent = "No words found in this category.";
                updateProgressUI();
                return;
            }
            
            flashcard.classList.remove('is-flipped');
            
            setTimeout(() => {
                if (shuffledDeck.length === 0) {
                    shuffledDeck = [...activeList]; 
                }
                
                let randomIndex = Math.floor(Math.random() * shuffledDeck.length);
                currentCardItem = shuffledDeck.splice(randomIndex, 1)[0];
                
                lugandaFront.textContent = currentCardItem.luganda;
                lugandaBack.textContent = currentCardItem.luganda;
                englishBack.textContent = currentCardItem.english;
                
                updateProgressUI();
            }, 200);
        }

        nextBtn.addEventListener('click', () => {
            currentCardItem = null; 
            getNewWord();
        });

        reviewBtn.addEventListener('click', () => {
            if (currentCardItem) {
                shuffledDeck.push(currentCardItem); 
                currentCardItem = null;
            }
            getNewWord();
        });

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
        });

        window.addEventListener('DOMContentLoaded', loadMasterData);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
