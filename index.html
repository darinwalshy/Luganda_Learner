<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luganda Learner</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Clean, modern resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 90px; /* Leave space for FAB */
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        header h1 {
            color: #1e3a8a;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        /* Category Dropdown Styling */
        .selector-container {
            width: 100%;
            margin-bottom: 25px;
        }

        .category-select {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: #1e3a8a;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .category-select:focus {
            border-color: #1e3a8a;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        /* Progress Counter Style */
        .progress-counter {
            font-size: 1rem;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: -15px;
        }

        /* 3D Flashcard Wrapper */
        .flashcard-container {
            width: 100%;
            height: 280px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
        }

        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card-front {
            background-color: #ffffff;
            color: #1e293b;
        }

        .card-front h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .card-back {
            background-color: #1e3a8a;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-back h3 {
            font-size: 1.2rem;
            font-weight: 400;
            opacity: 0.8;
            word-break: break-word;
        }

        .card-back hr {
            width: 40%;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            margin: 15px 0;
        }

        .card-back h2 {
            font-size: 1.5rem;
            font-weight: 600;
            word-break: break-word;
        }

        .hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.4;
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .secondary-row {
            display: flex;
            gap: 14px;
            width: 100%;
        }

        /* BASE BUTTON RESET */
        .btn-base {
            width: 100%;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-base:active {
            transform: scale(0.98);
        }

        /* PRIMARY ACTION: Next Word */
        .btn-primary {
            background-color: #10b981;
            color: white;
            padding: 24px; 
            font-size: 1.25rem; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-primary:hover {
            background-color: #059669;
        }

        /* SECONDARY ACTIONS */
        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
            padding: 16px; 
            font-size: 1.05rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
            color: #1e293b;
        }

        .btn-secondary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background-color: #e2e8f0;
            color: #94a3b8;
        }

        /* FLOATING ACTION BUTTON (FAB) */
        .fab-add {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px 22px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform 0.2s, background-color 0.2s;
        }

        .fab-add:active {
            transform: scale(0.95);
        }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.is-active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background-color: white;
            width: 100%;
            max-width: 440px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 28px 24px 32px 24px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.is-active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #1e3a8a;
            font-size: 1.4rem;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #64748b;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #1e3a8a;
        }

        .status-banner {
            font-size: 0.9rem;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .status-banner.success {
            display: block;
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-banner.info {
            display: block;
            background-color: #e0f2fe;
            color: #075985;
        }

        /* Version Badge Styling */
        footer {
            margin-top: auto;
            padding-top: 40px;
            padding-bottom: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <h1>Luganda Learner</h1>
        <div class="selector-container">
            <select id="categorySelect" class="category-select" onchange="switchCategory(this.value)">
                <option value="">Loading categories...</option>
            </select>
        </div>
    </header>

    <main class="app-container">
        <div id="progressCounter" class="progress-counter">--/--</div>

        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard" id="flashcard">
                <div class="card-side card-front">
                    <h2 id="lugandaFront">Loading...</h2>
                    <span class="hint">Tap to flip</span>
                </div>
                <div class="card-side card-back">
                    <h3 id="lugandaBack">Loading...</h3>
                    <hr>
                    <h2 id="englishBack">Loading...</h2>
                    <span class="hint">Tap to flip back</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="nextBtn" class="btn-base btn-primary">Next Word &rarr;</button>
            <div class="secondary-row">
                <button id="backBtn" class="btn-base btn-secondary" disabled>&larr; Back</button>
                <button id="reviewBtn" class="btn-base btn-secondary">Review again</button>
            </div>
        </div>
    </main>

    <!-- FLOATING ACTION BUTTON -->
    <button class="fab-add" id="openModalBtn">+ Add Word</button>

    <!-- ADD WORD MODAL -->
    <div class="modal-overlay" id="addWordModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Note New Word</h2>
                <button class="btn-close" id="closeModalBtn">&times;</button>
            </div>
            
            <div id="statusBanner" class="status-banner"></div>

            <form id="addWordForm">
                <div class="form-group">
                    <label for="lugandaInput">Luganda Word / Phrase</label>
                    <input type="text" id="lugandaInput" class="form-input" placeholder="e.g. Otiya" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="englishInput">English Translation</label>
                    <input type="text" id="englishInput" class="form-input" placeholder="e.g. How are you" required autocomplete="off">
                </div>
                <button type="submit" id="saveWordBtn" class="btn-base btn-primary" style="padding: 16px; margin-top: 10px;">
                    Save to Staging Sheet
                </button>
            </form>
        </div>
    </div>

    <footer>
        App Version: v3.4-StagingIngest
    </footer>

    <script>
        // CONFIGURATION
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5s5graaib7c09HAP5UHj6FgTsgSNca-jqeAHdW_7jUp4HMTHbhYNALaGTgxKKAXYiLQ/exec';
        const AUTH_TOKEN = 'Luganda_Staging_Secret_9x82qL'; // <-- Must match Apps Script

        let masterDatabase = {};
        let activeList = [];
        let shuffledDeck = [];
        let cardHistory = [];
        let currentCardItem = null;

        const flashcard = document.getElementById('flashcard');
        const nextBtn = document.getElementById('nextBtn');
        const backBtn = document.getElementById('backBtn');
        const reviewBtn = document.getElementById('reviewBtn');
        const lugandaFront = document.getElementById('lugandaFront');
        const lugandaBack = document.getElementById('lugandaBack');
        const englishBack = document.getElementById('englishBack');
        const categorySelect = document.getElementById('categorySelect');
        const progressCounter = document.getElementById('progressCounter');

        // Modal Elements
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const addWordModal = document.getElementById('addWordModal');
        const addWordForm = document.getElementById('addWordForm');
        const lugandaInput = document.getElementById('lugandaInput');
        const englishInput = document.getElementById('englishInput');
        const statusBanner = document.getElementById('statusBanner');
        const saveWordBtn = document.getElementById('saveWordBtn');

        // Flashcard Logic
        async function loadMasterData() {
            let rawText = "";
            try {
                const cloudUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTrD0C779Hpb_dIu5l0m67Wl-mbsDly4Cl0mb5ezYtY3DrIM8OAT2SabZr_fT09Lx_aXmPjLScXDksu/pub?gid=1997686313&single=true&output=csv';
                const response = await fetch(`${cloudUrl}&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Cloud fetch failed");
                rawText = await response.text();
                parseAndStoreCSV(rawText);
            } catch (error) {
                console.log("Cloud unavailable. Checking local storage fallback...", error);
                const storedData = localStorage.getItem('cachedLugandaWords');
                if (storedData) {
                    masterDatabase = JSON.parse(storedData);
                    buildCategoryDropdown();
                    instantiateCategorySelection();
                } else {
                    lugandaFront.innerText = "Offline: No saved data found";
                }
            }
        }

        function parseAndStoreCSV(text) {
            masterDatabase = {}; 
            const rows = text.split(/[\r\n]+/);
            
            for (let i = 0; i < rows.length; i++) {
                const currentRow = rows[i].trim();
                if (!currentRow) continue; 
                
                const columns = currentRow.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (columns.length < 3) continue; 
                
                const category = columns[0].replace(/^"|"$/g, '').trim(); 
                const lugandaWord = columns[1].replace(/^"|"$/g, '').trim();
                const englishWord = columns[2].replace(/^"|"$/g, '').trim();
                
                if (category.toLowerCase() === 'category') continue;
                
                if (!masterDatabase[category]) {
                    masterDatabase[category] = [];
                }
                masterDatabase[category].push({ luganda: lugandaWord, english: englishWord });
            }
            
            localStorage.setItem('cachedLugandaWords', JSON.stringify(masterDatabase));
            buildCategoryDropdown();
            instantiateCategorySelection();
        }

        function buildCategoryDropdown() {
            categorySelect.innerHTML = "";
            const categories = Object.keys(masterDatabase);
            if (categories.length === 0) {
                categorySelect.innerHTML = '<option value="">No categories found</option>';
                return;
            }
            categories.forEach(category => {
                const opt = document.createElement('option');
                opt.value = category;
                opt.textContent = category; 
                categorySelect.appendChild(opt);
            });
        }

        function instantiateCategorySelection() {
            let currentSelection = categorySelect.value;
            if (masterDatabase[currentSelection]) {
                switchCategory(currentSelection);
            } else {
                const fallback = Object.keys(masterDatabase)[0];
                if (fallback) {
                    categorySelect.value = fallback;
                    switchCategory(fallback);
                }
            }
        }
        
        function switchCategory(categoryKey) {
            if (!masterDatabase[categoryKey]) return;
            activeList = masterDatabase[categoryKey];
            shuffledDeck = [];
            cardHistory = [];
            currentCardItem = null;
            getNewWord();
        }

        function updateProgressUI() {
            if (activeList.length === 0) {
                progressCounter.textContent = "0/0";
                return;
            }
            let remainingCount = shuffledDeck.length;
            if (currentCardItem) remainingCount += 1;
            progressCounter.textContent = `${remainingCount}/${activeList.length}`;
            backBtn.disabled = cardHistory.length === 0;
        }

        function displayCard(card) {
            flashcard.classList.remove('is-flipped');
            setTimeout(() => {
                lugandaFront.textContent = card.luganda;
                lugandaBack.textContent = card.luganda;
                englishBack.textContent = card.english;
                updateProgressUI();
            }, 200);
        }

        function getNewWord() {
            if (activeList.length === 0) {
                lugandaFront.textContent = "Empty Deck";
                lugandaBack.textContent = "Empty Deck";
                englishBack.textContent = "No words found.";
                updateProgressUI();
                return;
            }
            
            if (currentCardItem) {
                cardHistory.push(currentCardItem);
            }
            
            if (shuffledDeck.length === 0) {
                shuffledDeck = [...activeList]; 
            }
            
            let randomIndex = Math.floor(Math.random() * shuffledDeck.length);
            currentCardItem = shuffledDeck.splice(randomIndex, 1)[0];
            
            displayCard(currentCardItem);
        }

        // Modal Controls
        openModalBtn.addEventListener('click', () => {
            addWordModal.classList.add('is-active');
            lugandaInput.focus();
        });

        closeModalBtn.addEventListener('click', () => {
            addWordModal.classList.remove('is-active');
            statusBanner.className = 'status-banner';
        });

        // STAGING INGEST & SYNC LOGIC
        addWordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const lugandaVal = lugandaInput.value.trim();
            const englishVal = englishInput.value.trim();
            if (!lugandaVal || !englishVal) return;

            const newEntry = { 
                luganda: lugandaVal, 
                english: englishVal,
                authToken: AUTH_TOKEN 
            };

            saveWordBtn.disabled = true;
            saveWordBtn.textContent = "Saving...";

            if (navigator.onLine) {
                const success = await sendToGoogleSheet(newEntry);
                if (success) {
                    showBanner("Saved to Google Sheet!", "success");
                    addWordForm.reset();
                } else {
                    // Fallback to queue if network post failed
                    queueLocally(newEntry);
                    showBanner("Network error. Saved locally (will auto-sync).", "info");
                    addWordForm.reset();
                }
            } else {
                queueLocally(newEntry);
                showBanner("Saved locally (Offline). Will auto-sync when online.", "info");
                addWordForm.reset();
            }

            saveWordBtn.disabled = false;
            saveWordBtn.textContent = "Save to Staging Sheet";
        });

        async function sendToGoogleSheet(dataPayload) {
            try {
                // Apps Script requires mode: 'no-cors' for web app redirects
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataPayload)
                });
                return true;
            } catch (err) {
                console.error("Submission failed:", err);
                return false;
            }
        }

        function queueLocally(entry) {
            let queue = JSON.parse(localStorage.getItem('pendingLugandaSync')) || [];
            queue.push(entry);
            localStorage.setItem('pendingLugandaSync', JSON.stringify(queue));
        }

        async function processPendingQueue() {
            if (!navigator.onLine) return;
            let queue = JSON.parse(localStorage.getItem('pendingLugandaSync')) || [];
            if (queue.length === 0) return;

            console.log(`Syncing ${queue.length} pending word(s) to Staging sheet...`);
            let remainingQueue = [];

            for (const item of queue) {
                const success = await sendToGoogleSheet(item);
                if (!success) {
                    remainingQueue.push(item);
                }
            }

            localStorage.setItem('pendingLugandaSync', JSON.stringify(remainingQueue));
            if (remainingQueue.length === 0) {
                console.log("All offline entries successfully synced to Google Sheet!");
            }
        }

        function showBanner(msg, type) {
            statusBanner.textContent = msg;
            statusBanner.className = `status-banner ${type}`;
            setTimeout(() => {
                statusBanner.className = 'status-banner';
            }, 4000);
        }

        // Event Listeners
        nextBtn.addEventListener('click', getNewWord);

        backBtn.addEventListener('click', () => {
            if (cardHistory.length === 0) return;
            if (currentCardItem) shuffledDeck.push(currentCardItem);
            currentCardItem = cardHistory.pop();
            displayCard(currentCardItem);
        });

        reviewBtn.addEventListener('click', () => {
            if (currentCardItem) {
                shuffledDeck.push(currentCardItem); 
                currentCardItem = null;
            }
            getNewWord();
        });

        flashcard.addEventListener('click', () => {
            flashcard.classList.toggle('is-flipped');
        });

        // Network status & Init
        window.addEventListener('online', processPendingQueue);

        window.addEventListener('DOMContentLoaded', () => {
            loadMasterData();
            processPendingQueue();
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const dynamicScope = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                navigator.serviceWorker.register('./sw.js', { scope: dynamicScope })
                    .then((reg) => console.log('Service Worker registered.'))
                    .catch((err) => console.log('Service Worker registration failed.', err));
            });
        }
    </script>
</body>
</html>
